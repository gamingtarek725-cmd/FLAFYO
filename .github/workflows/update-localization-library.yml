name: update localization library
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_localization_library.py"
      - ".github/workflows/update-localization-library.yml"
permissions:
  contents: write
concurrency:
  group: localization-library-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image conversion dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Refresh source index and cache optimized cover artwork
        run: python scripts/update_localization_library.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/localization-library.json data/covers/; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/localization-library.json data/covers/
          git commit -m "Refresh game localization catalog"
          git push
