name: publish Windows release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "إصدار التطبيق التالي بصيغة مثل 0.3.5"
        required: true
        default: "0.3.5"
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet test tests/Flafyo.Core.Tests -c Release
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.TrimStart([char[]]@('v', 'V'))
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          [xml]$project = Get-Content src/Flafyo.App/Flafyo.App.csproj
          $project.Project.PropertyGroup.Version = $version
          $project.Save("src/Flafyo.App/Flafyo.App.csproj")
          (Get-Content installer/FLAFYO.iss) -replace 'AppVersion=.*', "AppVersion=$version" | Set-Content installer/FLAFYO.iss
      - name: Generate FLAFYO application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_app_icon.py
      - name: Publish application
        run: dotnet publish src/Flafyo.App/Flafyo.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\FLAFYO.iss
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe
