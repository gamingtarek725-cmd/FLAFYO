name: build
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  madlad-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned MADLAD INT4 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://github.com/niedev/OnnxModelsEnhancer/releases/download/v1.0.0-beta/Madlad.zip" \
            --output "$RUNNER_TEMP/Madlad.zip"
          stat --printf="Archive bytes: %s\\n" "$RUNNER_TEMP/Madlad.zip"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive files and inspect ONNX graph contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check onnx==1.19.0
          python - <<'PY'
          import hashlib, json, zipfile, onnx
          archive = r"${{ runner.temp }}/Madlad.zip"
          expected = [
              "Madlad/madlad_embed_8bit.onnx",
              "Madlad/Int4Acc4/madlad_encoder_4bit.onnx",
              "Madlad/Int4Acc4/madlad_cache_initializer_4bit.onnx",
              "Madlad/Int4Acc4/madlad_decoder_4bit.onnx",
              "Madlad/spiece.model",
          ]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              missing = [name for name in expected if name not in names]
              if missing:
                  raise SystemExit("Required MADLAD files missing: " + ", ".join(missing))
              for name in expected:
                  info = z.getinfo(name)
                  digest = hashlib.sha256()
                  with z.open(info) as stream:
                      for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                          digest.update(chunk)
                  record = {"path": name, "bytes": info.file_size, "sha256": digest.hexdigest()}
                  if name.endswith(".onnx"):
                      model = onnx.load_model_from_string(z.read(name))
                      def vi(v):
                          t = v.type.tensor_type
                          dims = [d.dim_param if d.dim_param else d.dim_value for d in t.shape.dim]
                          return {"name": v.name, "elem_type": t.elem_type, "shape": dims}
                      record["inputs"] = [vi(v) for v in model.graph.input]
                      record["outputs"] = [vi(v) for v in model.graph.output]
                      record["opsets"] = [{"domain": x.domain, "version": x.version} for x in model.opset_import]

                      # Fail CI if the pinned export no longer matches the tensors required by the .NET runtime.
                      inputs = {item["name"]: item for item in record["inputs"]}
                      outputs = {item["name"]: item for item in record["outputs"]}
                      def require_tensor(table, tensor_name, elem_type, shape):
                          actual = table.get(tensor_name)
                          if actual is None:
                              raise SystemExit(f"{name}: missing tensor {tensor_name}")
                          if actual["elem_type"] != elem_type or actual["shape"] != shape:
                              raise SystemExit(f"{name}: {tensor_name} expected type={elem_type} shape={shape}, got {actual}")

                      if name.endswith("madlad_embed_8bit.onnx"):
                          require_tensor(inputs, "input_ids", 7, ["batch_size", "sequence_length"])
                          require_tensor(outputs, "embed_matrix", 1, ["batch_size", "sequence_length", 1024])
                      elif name.endswith("madlad_encoder_4bit.onnx"):
                          require_tensor(inputs, "embed_matrix", 1, ["batch_size", "sequence_length", 1024])
                          require_tensor(inputs, "input_ids", 7, ["batch_size", "encoder_sequence_length"])
                          require_tensor(inputs, "attention_mask", 7, ["batch_size", "encoder_sequence_length"])
                          require_tensor(outputs, "last_hidden_state", 1, ["batch_size", "encoder_sequence_length", 1024])
                      elif name.endswith("madlad_cache_initializer_4bit.onnx"):
                          require_tensor(inputs, "encoder_hidden_states", 1, [1, "encoder_sequence_length", 1024])
                          expected = {f"present.{layer}.encoder.{part}" for layer in range(32) for part in ("key", "value")}
                          if set(outputs) != expected:
                              raise SystemExit(f"{name}: expected 64 encoder cache outputs, got {len(outputs)}")
                          for tensor_name in expected:
                              require_tensor(outputs, tensor_name, 1, [1, 16, "encoder_sequence_length", 128])
                      elif name.endswith("madlad_decoder_4bit.onnx"):
                          require_tensor(inputs, "embed_matrix", 1, ["batch_size", "sequence_length", 1024])
                          require_tensor(inputs, "encoder_attention_mask", 7, ["batch_size", "encoder_sequence_length"])
                          require_tensor(inputs, "input_ids", 7, ["batch_size", "decoder_sequence_length"])
                          require_tensor(outputs, "logits", 1, ["batch_size", "1", 256000])
                          expected_inputs = {"embed_matrix", "encoder_attention_mask", "input_ids"}
                          expected_inputs |= {f"past_key_values.{layer}.{kind}.{part}" for layer in range(32) for kind in ("decoder", "encoder") for part in ("key", "value")}
                          expected_outputs = {"logits"} | {f"present.{layer}.decoder.{part}" for layer in range(32) for part in ("key", "value")}
                          if set(inputs) != expected_inputs:
                              raise SystemExit(f"{name}: decoder input contract mismatch (found {len(inputs)} tensors)")
                          if set(outputs) != expected_outputs:
                              raise SystemExit(f"{name}: decoder output contract mismatch (found {len(outputs)} tensors)")
                          for layer in range(32):
                              for part in ("key", "value"):
                                  require_tensor(inputs, f"past_key_values.{layer}.decoder.{part}", 1, ["batch_size", 16, "past_decoder_sequence_length", 128])
                                  require_tensor(inputs, f"past_key_values.{layer}.encoder.{part}", 1, ["batch_size", 16, "encoder_sequence_length", 128])
                                  require_tensor(outputs, f"present.{layer}.decoder.{part}", 1, ["batch_size", 16, "past_decoder_sequence_length + decoder_sequence_length", 128])
                  print(json.dumps(record, indent=2))
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract verified MADLAD graph files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "Madlad.zip"
          root = Path(os.environ["RUNNER_TEMP"]) / "madlad-model"
          expected = [
              "Madlad/madlad_embed_8bit.onnx",
              "Madlad/Int4Acc4/madlad_encoder_4bit.onnx",
              "Madlad/Int4Acc4/madlad_cache_initializer_4bit.onnx",
              "Madlad/Int4Acc4/madlad_decoder_4bit.onnx",
              "Madlad/spiece.model",
          ]
          with zipfile.ZipFile(archive) as z:
              for name in expected:
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as source, target.open("wb") as destination:
                      shutil.copyfileobj(source, destination, length=8 * 1024 * 1024)
          print(f"Extracted MADLAD files to {root}")
          PY
          echo "FLAFYO_MADLAD_MODEL_DIR=$RUNNER_TEMP/madlad-model" >> "$GITHUB_ENV"
      - name: Real MADLAD Arabic translation test (required)
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName~Madlad_model_produces_arabic" --logger "console;verbosity=detailed"

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Run tests (excluding the Linux-only MADLAD model integration test)
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName!~Madlad_model_produces_arabic"
      - name: Generate FLAFYO application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_app_icon.py
      - name: Build EXE
        run: dotnet publish src/Flafyo.App/Flafyo.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: SHA256
        run: Get-FileHash publish/FLAFYO.GameTranslator.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: FLAFYO-GAME-TRANSLATOR
          path: publish/FLAFYO.GameTranslator.exe
      - name: Build installer (Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" installer\\FLAFYO.iss
          if (!(Test-Path installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe)) {
            throw "Installer output was not created."
          }
      - name: SHA256 installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FLAFYO-GAME-TRANSLATOR-Setup.exe" | Set-Content installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe.sha256
          Write-Host "Installer SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: FLAFYO-Setup
          path: |
            installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe
            installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe.sha256
      - name: Download light language pack (required for the real-model test)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://huggingface.co/Xenova/opus-mt-en-ar/resolve/63765349ac9f6c43f6e5bd8c0a5583224cfd8587"
          $dir = Join-Path $env:RUNNER_TEMP "model"
          New-Item -ItemType Directory -Force (Join-Path $dir "onnx") | Out-Null
          foreach ($f in "config.json","generation_config.json","source.spm","target.spm","vocab.json","onnx/encoder_model_quantized.onnx","onnx/decoder_model_quantized.onnx") {
            Invoke-WebRequest "$base/$f" -OutFile (Join-Path $dir $f)
          }
          "FLAFYO_MODEL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real light translation test (required)
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName~OnnxMarianIntegration" --logger "console;verbosity=detailed"
      - name: Download heavy language pack (required for the heavy-model test)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://huggingface.co/Xenova/nllb-200-distilled-600M/resolve/bfaad393bfa9f83f73fb0ddaeb21f42d3323e821"
          $dir = Join-Path $env:RUNNER_TEMP "heavy"
          New-Item -ItemType Directory -Force (Join-Path $dir "onnx") | Out-Null
          foreach ($f in "config.json","generation_config.json","tokenizer.json","onnx/encoder_model_quantized.onnx","onnx/decoder_model_merged_quantized.onnx") {
            Invoke-WebRequest "$base/$f" -OutFile (Join-Path $dir $f)
          }
          "FLAFYO_HEAVY_MODEL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real heavy translation test (required)
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName~OnnxNllbHeavyIntegration" --logger "console;verbosity=detailed"
