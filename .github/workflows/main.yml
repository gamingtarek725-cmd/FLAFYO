name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      validate_madlad:
        description: "تنزيل واختبار نموذج MADLAD الكبير (حوالي 3.7 جيجا)"
        required: false
        default: false
        type: boolean
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Run tests
        run: dotnet test tests/Flafyo.Core.Tests -c Release
      - name: Build EXE
        run: dotnet publish src/Flafyo.App/Flafyo.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: SHA256
        run: Get-FileHash publish/FLAFYO.GameTranslator.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: FLAFYO-GAME-TRANSLATOR
          path: publish/FLAFYO.GameTranslator.exe
      - name: Build installer (Setup.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\FLAFYO.iss
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FLAFYO-Setup
          path: installer-out/FLAFYO-GAME-TRANSLATOR-Setup.exe
      - name: Download light language pack (for the real-model test)
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://huggingface.co/Xenova/opus-mt-en-ar/resolve/63765349ac9f6c43f6e5bd8c0a5583224cfd8587"
          $dir = Join-Path $env:RUNNER_TEMP "model"
          New-Item -ItemType Directory -Force (Join-Path $dir "onnx") | Out-Null
          foreach ($f in "config.json","generation_config.json","source.spm","target.spm","vocab.json","onnx/encoder_model_quantized.onnx","onnx/decoder_model_quantized.onnx") {
            Invoke-WebRequest "$base/$f" -OutFile (Join-Path $dir $f)
          }
          "FLAFYO_MODEL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real light translation test
        continue-on-error: true
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName~OnnxMarianIntegration" --logger "console;verbosity=detailed"
      - name: Download heavy language pack (for the heavy-model test)
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://huggingface.co/Xenova/nllb-200-distilled-600M/resolve/bfaad393bfa9f83f73fb0ddaeb21f42d3323e821"
          $dir = Join-Path $env:RUNNER_TEMP "heavy"
          New-Item -ItemType Directory -Force (Join-Path $dir "onnx") | Out-Null
          foreach ($f in "config.json","generation_config.json","tokenizer.json","onnx/encoder_model_quantized.onnx","onnx/decoder_model_merged_quantized.onnx") {
            Invoke-WebRequest "$base/$f" -OutFile (Join-Path $dir $f)
          }
          "FLAFYO_HEAVY_MODEL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real heavy translation test
        continue-on-error: true
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName~OnnxNllbHeavyIntegration" --logger "console;verbosity=detailed"
      - name: Download MADLAD 3B INT4 pack (manual validation only)
        if: github.event_name == 'workflow_dispatch' && inputs.validate_madlad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://huggingface.co/tonythethompson/madlad400-3b-mt-onnx/resolve/c165d741425c82365761aae98d0891bd9e7995ed/mixed_fp16_int4"
          $dir = Join-Path $env:RUNNER_TEMP "madlad"
          $files = @(
            "config.json",
            "generation_config.json",
            "spiece.model",
            "onnx/encoder_model.onnx",
            "onnx/encoder_model.onnx.data",
            "onnx/decoder_model_merged.onnx",
            "onnx/decoder_model_merged.onnx.data"
          )
          foreach ($f in $files) {
            $target = Join-Path $dir $f
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            curl.exe -L --fail --retry 3 --retry-delay 2 "$base/$f" -o "$target"
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $f" }
          }
          "FLAFYO_MADLAD_MODEL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real MADLAD 3B translation test
        if: github.event_name == 'workflow_dispatch' && inputs.validate_madlad
        run: dotnet test tests/Flafyo.Core.Tests -c Release --filter "FullyQualifiedName~OnnxMadladIntegrationTests" --logger "console;verbosity=detailed"
